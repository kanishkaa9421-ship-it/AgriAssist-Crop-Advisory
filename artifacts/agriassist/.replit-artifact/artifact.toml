kind = "web"
previewPath = "/"
title = "AgriAssist Crop Advisory"
description = "A responsive crop advisory companion for farmers to track crops, understand risks, and receive practical AI-powered disease, weather, nutrition, and market guidance."
version = "1.0.0"
id = "artifacts/agriassist"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23521

[services.development]
run = "pnpm --filter @workspace/agriassist run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agriassist", "run", "build" ]
serve = "static"
publicDir = "artifacts/agriassist/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23521"
BASE_PATH = "/"
